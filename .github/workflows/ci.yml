name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-python:
    name: Fast Python (Feature Branch)
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint (Python only)
        run: flake8 src/zoo
      - name: Run fast tests (ARGoS-less)
        run: pytest -q

  full-integration:
    name: Full Integration (PR/Main)
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: macos-latest
    env:
      PYTHON_VERSION: '3.12'
      HOMEBREW_NO_AUTO_UPDATE: 1   # speed & determinism (we explicitly update if we want)
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Show runner & preinstalled tools (debug)
        run: |
          sw_vers || true
          uname -a
          echo "Preinstalled cmake: $(command -v cmake || echo 'missing')"
          (cmake --version 2>/dev/null | head -1) || true
          brew --version
          echo "Existing brew formula count: $(brew list --formula | wc -l | tr -d ' ')"

      - name: Install Homebrew deps (idempotent)
        run: |
          set -euo pipefail
          echo "Updating brew metadata (shallow)"
          brew update --quiet

          # Avoid cmake tap conflict by only installing if missing
            if command -v cmake >/dev/null 2>&1; then
              echo "cmake already present ($(cmake --version | head -1)) -> skip install"
            else
              echo "cmake missing -> installing"
              brew install cmake
            fi

          FORMULAE="pkg-config libpng freeimage qt freeglut lua docbook asciidoc graphviz doxygen zeromq cppzmq clang-format"
          for f in $FORMULAE; do
            if brew list --versions "$f" >/dev/null 2>&1; then
              echo "[brew] $f already installed"
            else
              echo "[brew] Installing $f"
              brew install "$f"
            fi
          done

          echo "Brew deps done. Summary of selected versions:" 
          for b in cmake zeromq lua graphviz doxygen; do
            brew info --json=v2 $b | jq -r '.formulae[0] | "'"$b"'" + ": " + .installed[0].version' || true
          done

      - name: Clone ARGoS source
        run: |
          # Use shallow clone for speed; adjust branch/tag as needed
            if [ ! -d argos3 ]; then
              git clone --depth 1 https://github.com/ilpincy/argos3.git
            fi

      - name: Restore ARGoS build cache
        uses: actions/cache@v4
        with:
          path: argos3/build
          key: macos-argos-build-v1-${{ hashFiles('argos3/src/CMakeLists.txt') }}
          restore-keys: |
            macos-argos-build-v1-

      - name: Build & Install ARGoS
        run: |
          cd argos3
          mkdir -p build
          cd build
          cmake -DCMAKE_CXX_STANDARD=17 ../src
          make -j$(sysctl -n hw.ncpu)
          # Ensure docs (some versions expect doc targets before install)
          make doc || echo "Doc build failed (non-fatal)"
          sudo make install
          which argos3 || (echo "argos3 not on PATH after install" && exit 1)
          argos3 -q version || echo "Version query failed (check install)"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pettingzoo

      - name: Lint C++
        run: |
          set -eo pipefail
          start_ts=$(date +%s)
          # Exclude third-party / vendor single-header to avoid long format time
          FILES=$(find src/plugin -type f \( -name '*.h' -o -name '*.hpp' -o -name '*.cpp' \) ! -path 'src/plugin/common/json.hpp')
          if [ -z "$FILES" ]; then
            echo "[lint-c++] No C++ source files found under src/plugin (skip).";
            exit 0;
          fi
          count=$(echo "$FILES" | wc -w | tr -d ' ')
          echo "[lint-c++] File count: $count"
          echo "[lint-c++] clang-format: $(clang-format --version || echo 'missing')"
          echo "[lint-c++] Files:"; echo "$FILES" | tr ' ' '\n'
          printf '%s\n' $FILES | xargs -n8 clang-format -n --Werror
          end_ts=$(date +%s)
          echo "[lint-c++] Completed in $((end_ts-start_ts))s."

      - name: Lint Python
        run: flake8 src/zoo

      - name: Build C++ plugin
        run: |
          mkdir build
          cd build
          cmake ..
          make -j$(sysctl -n hw.ncpu)

      - name: Run full test suite
        run: pytest -q