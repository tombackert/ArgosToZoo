# Name des GitHub Actions-Workflows
name: ArgosToZoo CI

# Löst den Workflow bei jedem Push oder Pull Request auf den 'main'-Branch aus
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Definiert einen einzelnen Job namens 'build-and-test'
  build-and-test:
    # Führt den Job auf dem neuesten macOS-Runner aus
    runs-on: macos-latest

    steps:
      # Schritt 1: Code aus dem Repository auschecken
      - name: Checkout repository
        uses: actions/checkout@v4

      # Schritt 2: C++-Abhängigkeiten und ARGoS-Voraussetzungen installieren
      - name: Install C++ Dependencies
        run: |
          brew install cmake freeimage qt5 lua asciidoc doxygen graphviz zeromq clang-format nlohmann-json

      # Schritt 3: ARGoS aus dem Quellcode installieren
      - name: Install ARGoS from Source
        run: |
          git clone https://github.com/ilpincy/argos3.git
          cd argos3
          mkdir build && cd build
          cmake ../src
          make
          sudo make install

      # Schritt 4: Python-Umgebung einrichten
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Schritt 5: Python-Abhängigkeiten installieren
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Schritt 6: C++-Code mit clang-format linten
      - name: Lint C++ code
        run: |
          find plugin -iname *.h -o -iname *.cpp | xargs clang-format --dry-run --Werror

      # Schritt 7: Python-Code mit flake8 linten
      - name: Lint Python code
        run: |
          flake8 . --count --show-source --statistics

      # Schritt 8: C++-Plugin kompilieren
      - name: Build C++ Plugin
        run: |
          mkdir build
          cd build
          cmake ..
          make

      # Schritt 9: Python-Tests mit pytest ausführen
      - name: Run Python Tests
        run: |
          pytest