# Name des GitHub Actions-Workflows
name: ArgosToZoo CI

# Löst den Workflow bei jedem Push oder Pull Request auf den 'main'-Branch aus
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      # Schritt 1: Code aus dem Repository auschecken
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install All C++ Dependencies
        run: |
          brew install pkg-config cmake libpng freeimage qt freeglut lua docbook asciidoc graphviz doxygen zeromq cppzmq clang-format nlohmann-json 

      - name: Install ARGoS from Source
        run: |
          echo "Cloning ARGoS repository..."
          git clone https://github.com/ilpincy/argos3.git
          cd argos3
          echo "Creating build directory..."
          mkdir build && cd build
          echo "Running CMake to configure the build..."
          cmake ../src
          echo "Building ARGoS binaries..."
          make -j$(sysctl -n hw.ncpu)
          echo "Building ARGoS documentation (required for install)..."
          make doc
          echo "Installing ARGoS..."
          sudo make install

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint C++ code
        run: |
          # Führen Sie diesen Schritt aus, aber lassen Sie ihn nicht bei Fehlern abbrechen
          find plugin -iname *.h -o -iname *.cpp | xargs clang-format --dry-run -Wno-error || true
      
      # Schritt 7: Python-Code auf Korrektheit prüfen (Stil-Warnungen ignorieren)
      - name: Lint Python code for correctness
        run: |
          # Prüft nur auf "F"-Fehler (Korrektheit), ignoriert "E/W"-Stilfehler
          flake8 . --select=F --count --show-source --statistics

      # ... (alle nachfolgenden Schritte bleiben unverändert) ...
      - name: Build C++ Plugin
        run: |
          mkdir build
          cd build
          cmake ..
          make

      - name: Run Python Tests
        run: |
          pytest