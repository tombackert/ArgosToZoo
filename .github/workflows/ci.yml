# Name des GitHub Actions-Workflows
name: ArgosToZoo CI

# Löst den Workflow bei jedem Push oder Pull Request auf den 'main'-Branch aus
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      # Schritt 1: Code aus dem Repository auschecken
      - name: Checkout repository
        uses: actions/checkout@v4

      # Schritt 2: Alle Abhängigkeiten gemäß ARGoS README installieren
      - name: Install All C++ Dependencies
        run: |
          brew install pkg-config cmake libpng freeimage qt freeglut lua docbook asciidoc graphviz doxygen zeromq cppzmq clang-format

      # Schritt 3: ARGoS aus dem Quellcode gemäß README installieren
      - name: Install ARGoS from Source
        run: |
          echo "Cloning ARGoS repository..."
          git clone https://github.com/ilpincy/argos3.git
          cd argos3
          echo "Creating build directory..."
          mkdir build && cd build
          echo "Running CMake to configure the build..."
          cmake -DCMAKE_CXX_STANDARD=17 ../src
          echo "Building ARGoS binaries..."
          make -j$(sysctl -n hw.ncpu)
          echo "Building ARGoS documentation (required for install)..."
          make doc
          echo "Installing ARGoS..."
          sudo make install

      # Schritt 4: Python-Umgebung einrichten
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Schritt 5: Python-Abhängigkeiten installieren
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Schritt 6: C++-Code linten
      - name: Lint C++ code
        run: |
          find plugin -iname *.h -o -iname *.cpp | xargs clang-format --dry-run --Werror

      # Schritt 7: Python-Code auf Korrektheit prüfen
      - name: Lint Python code for correctness
        run: |
          flake8 . --select=F --count --show-source --statistics

      # Schritt 8: C++-Plugin kompilieren
      - name: Build C++ Plugin
        run: |
          mkdir build
          cd build
          cmake ..
          make

      # Schritt 9: Python-Tests mit pytest ausführen
      - name: Run Python Tests
        run: |
          pytest